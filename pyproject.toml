[tool.poetry]
name = "sprocket-py"
version = "0.1.0"
description = "PoC for Sprocket WDL Python Bindings"
authors = ["Admin"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
maturin = "^1.12.6"
pytest = "^8.4.2"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sprocket_py"
args = ["--features", "pyo3/abi3-py312", "--compatibility", "abi3"]